# A copier dans /etc/mosquitto/conf.d/ puis redemarrer le service mosquitto.
#
#   sudo cp mosquitto/websockets.conf /etc/mosquitto/conf.d/websockets.conf
#   sudo systemctl restart mosquitto
#
# Pieges Mosquitto quand on declare des "listener" explicites :
# 1) le listener 1883 implicite par defaut disparait completement -> il faut
#    le redeclarer ici, sinon tout le backend C++ perd sa connexion.
# 2) l'acces anonyme est desactive par defaut (CONNACK 5, connexion refusee)
#    -> a reautoriser explicitement pour ce projet de demo locale, sans auth.

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
