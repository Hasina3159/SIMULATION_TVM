# A copier dans /etc/mosquitto/conf.d/ puis redemarrer le service mosquitto.
# Ajoute un listener websocket en plus du listener TCP 1883 par defaut
# (n'importe rien a la config existante, purement additif).
#
#   sudo cp mosquitto/websockets.conf /etc/mosquitto/conf.d/websockets.conf
#   sudo systemctl restart mosquitto
#
# Sans ca, le frontend (client-app/index.html) ne pourra pas se connecter
# au broker depuis le navigateur (MQTT sur WebSocket, port 9001).

listener 9001
protocol websockets
